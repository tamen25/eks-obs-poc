# Cluster events (reason=Evicted, Killing, ...) are an API-level stream, so a
# single replica collects them; running this in the DaemonSet would duplicate
# every event once per node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-events
  namespace: logging
data:
  fluent-bit.yaml: |
    service:
      flush: 1
      log_level: info

    pipeline:
      inputs:
        - name: kubernetes_events
          tag: k8s_events
          kube_url: https://kubernetes.default.svc
          interval_sec: 2
          db: /tmp/events.db

      outputs:
        - name: loki
          match: k8s_events
          host: evict-lgtm
          port: 3100
          labels: shipper=fluent-bit-events, job=k8s-events, namespace=$involvedObject['namespace'], reason=$reason, kind=$involvedObject['kind']
          line_format: json
          retry_limit: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-events
  namespace: logging
  labels: {app: fluent-bit-events}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fluent-bit-events}
  template:
    metadata:
      labels: {app: fluent-bit-events}
    spec:
      serviceAccountName: log-shipper
      priorityClassName: system-cluster-critical
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          args: ["-c", "/fluent-bit/etc/conf/fluent-bit.yaml"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/conf}
      volumes:
        - name: config
          configMap: {name: fluent-bit-events}
