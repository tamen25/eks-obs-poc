# Control group: the same pipeline as fluent-bit.yaml with Fluent Bit's stock
# tail settings (refresh_interval 60s, read_from_head off, rotate_wait 5s, no
# filesystem buffering). Shows what the tuning in 10-fluent-bit.yaml buys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-defaults
  namespace: logging
data:
  fluent-bit.yaml: |
    service:
      flush: 1
      log_level: info

    pipeline:
      inputs:
        - name: tail
          tag: kube.*
          path: /var/log/containers/*.log
          multiline.parser: cri
          db: /var/lib/fluent-bit-defaults/tail.db

      filters:
        - name: kubernetes
          match: kube.*
          kube_tag_prefix: kube.var.log.containers.
          merge_log: off
          labels: off
          annotations: off

      outputs:
        - name: loki
          match: kube.*
          host: evict-lgtm
          port: 3100
          labels: shipper=fluent-bit-defaults, node=${NODE_NAME}, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']
          remove_keys: kubernetes, stream, _p, time
          drop_single_key: raw
          line_format: key_value
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit-defaults
  namespace: logging
  labels: {app: fluent-bit-defaults}
spec:
  selector:
    matchLabels: {app: fluent-bit-defaults}
  template:
    metadata:
      labels: {app: fluent-bit-defaults}
    spec:
      serviceAccountName: log-shipper
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          args: ["-c", "/fluent-bit/etc/conf/fluent-bit.yaml"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: state, mountPath: /var/lib/fluent-bit-defaults}
            - {name: config, mountPath: /fluent-bit/etc/conf}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: state
          hostPath: {path: /var/lib/fluent-bit-defaults, type: DirectoryOrCreate}
        - name: config
          configMap: {name: fluent-bit-defaults}
