# Two-tier shipping for the node-crash case. The node agent forwards to an
# aggregator on another node and drops a chunk only once the aggregator has
# acknowledged it (require_ack_response). The aggregator buffers on its own disk
# and does the slow part (pushing to Loki), so a Loki slowdown builds its backlog
# off the node, not on it. When a node dies, only what the agent had not forwarded
# yet is lost: about one flush interval.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-aggregator
  namespace: logging
data:
  fluent-bit.yaml: |
    service:
      flush: 1
      log_level: info
      storage.path: /var/lib/fluent-bit-aggregator/storage
      # fsync each chunk write, so an acknowledged chunk survives an aggregator crash.
      storage.sync: full

    pipeline:
      inputs:
        - name: forward
          listen: 0.0.0.0
          port: 24224
          storage.type: filesystem

      outputs:
        - name: loki
          match: '*'
          host: evict-lgtm
          port: 3100
          labels: shipper=fb-via-agg, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']
          remove_keys: kubernetes, stream, _p, time
          drop_single_key: raw
          line_format: key_value
          retry_limit: false
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit-aggregator
  namespace: logging
spec:
  selector: {app: fluent-bit-aggregator}
  ports:
    - {name: forward, port: 24224, targetPort: 24224}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-aggregator
  namespace: logging
  labels: {app: fluent-bit-aggregator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fluent-bit-aggregator}
  template:
    metadata:
      labels: {app: fluent-bit-aggregator}
    spec:
      priorityClassName: system-cluster-critical
      # Off the workload node: the point is to survive that node.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          args: ["-c", "/fluent-bit/etc/conf/fluent-bit.yaml"]
          ports:
            - {name: forward, containerPort: 24224}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: state, mountPath: /var/lib/fluent-bit-aggregator}
            - {name: config, mountPath: /fluent-bit/etc/conf}
      volumes:
        # hostPath stands in for a PersistentVolume in this lab.
        - name: state
          hostPath: {path: /var/lib/fluent-bit-aggregator, type: DirectoryOrCreate}
        - name: config
          configMap: {name: fluent-bit-aggregator}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-agg-agent
  namespace: logging
data:
  fluent-bit.yaml: |
    service:
      flush: 1
      log_level: info
      storage.path: /var/lib/fluent-bit-agg-agent/storage
      storage.sync: normal

    pipeline:
      inputs:
        - name: tail
          tag: kube.*
          path: /var/log/containers/*.log
          multiline.parser: cri
          db: /var/lib/fluent-bit-agg-agent/tail.db
          db.locking: true
          refresh_interval: 1
          read_from_head: true
          rotate_wait: 300
          skip_long_lines: on
          storage.type: filesystem

      filters:
        - name: kubernetes
          match: kube.*
          kube_tag_prefix: kube.var.log.containers.
          merge_log: off
          labels: off
          annotations: off

      outputs:
        - name: forward
          match: kube.*
          host: fluent-bit-aggregator.logging.svc
          port: 24224
          # Keep the chunk until the aggregator confirms it has it.
          require_ack_response: true
          retry_limit: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit-agg-agent
  namespace: logging
  labels: {app: fluent-bit-agg-agent}
spec:
  selector:
    matchLabels: {app: fluent-bit-agg-agent}
  template:
    metadata:
      labels: {app: fluent-bit-agg-agent}
    spec:
      serviceAccountName: log-shipper
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          args: ["-c", "/fluent-bit/etc/conf/fluent-bit.yaml"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: state, mountPath: /var/lib/fluent-bit-agg-agent}
            - {name: config, mountPath: /fluent-bit/etc/conf}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: state
          hostPath: {path: /var/lib/fluent-bit-agg-agent, type: DirectoryOrCreate}
        - name: config
          configMap: {name: fluent-bit-agg-agent}
