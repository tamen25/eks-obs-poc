apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: Namespace
metadata:
  name: evict-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-shipper
  namespace: logging
---
# Shared by Fluent Bit and Promtail: pod/namespace metadata for enrichment and
# discovery, events for the eviction-event collector.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: log-shipper
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, events]
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-shipper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: log-shipper
subjects:
  - kind: ServiceAccount
    name: log-shipper
    namespace: logging
