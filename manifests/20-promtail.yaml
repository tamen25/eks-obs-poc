apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail
  namespace: logging
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
      log_level: info

    positions:
      # On the node, so a restarted promtail resumes instead of re-reading or skipping.
      filename: /var/lib/promtail/positions.yaml

    clients:
      - url: http://evict-lgtm:3100/loki/api/v1/push

    target_config:
      # How often file globs are re-evaluated (default 10s).
      sync_period: 2s

    scrape_configs:
      # Standard setup: targets come from the Kubernetes API. A target exists only
      # while its pod object exists in the API.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - target_label: shipper
            replacement: promtail-sd
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: logging
  labels: {app: promtail}
spec:
  selector:
    matchLabels: {app: promtail}
  template:
    metadata:
      labels: {app: promtail}
    spec:
      serviceAccountName: log-shipper
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:3.6.11
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          env:
            # kubernetes_sd keeps only targets whose __host__ matches this.
            - name: HOSTNAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          ports:
            - {name: http, containerPort: 3101}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: state, mountPath: /var/lib/promtail}
            - {name: config, mountPath: /etc/promtail}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: state
          hostPath: {path: /var/lib/promtail, type: DirectoryOrCreate}
        - name: config
          configMap: {name: promtail}
