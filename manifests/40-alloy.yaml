# Grafana Alloy, Promtail's successor: glob /var/log/pods (no API dependency,
# like promtail-static) with labels taken from the path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: logging
data:
  config.alloy: |
    local.file_match "pods" {
      path_targets = [{"__path__" = "/var/log/pods/*/*/*.log"}]
      // Default 10s: how often the glob is re-evaluated to find new files.
      sync_period = "1s"
    }

    discovery.relabel "pods" {
      targets = local.file_match.pods.targets
      rule {
        source_labels = ["__path__"]
        regex         = "/var/log/pods/([^_]+)_([^_]+)_[^/]+/([^/]+)/.*"
        target_label  = "namespace"
        replacement   = "$1"
      }
      rule {
        source_labels = ["__path__"]
        regex         = "/var/log/pods/([^_]+)_([^_]+)_[^/]+/([^/]+)/.*"
        target_label  = "pod"
        replacement   = "$2"
      }
      rule {
        source_labels = ["__path__"]
        regex         = "/var/log/pods/([^_]+)_([^_]+)_[^/]+/([^/]+)/.*"
        target_label  = "container"
        replacement   = "$3"
      }
      rule {
        target_label = "shipper"
        replacement  = "alloy"
      }
    }

    loki.source.file "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      stage.cri {}
      forward_to = [loki.write.lab.receiver]
    }

    loki.write "lab" {
      endpoint {
        url = "http://evict-lgtm:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: logging
  labels: {app: alloy}
spec:
  selector:
    matchLabels: {app: alloy}
  template:
    metadata:
      labels: {app: alloy}
    spec:
      serviceAccountName: log-shipper
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: state, mountPath: /var/lib/alloy}
            - {name: config, mountPath: /etc/alloy}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: state
          hostPath: {path: /var/lib/alloy, type: DirectoryOrCreate}
        - name: config
          configMap: {name: alloy}
