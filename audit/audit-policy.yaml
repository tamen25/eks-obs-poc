# Record who evicted or deleted a pod. Eviction-API calls (drain, autoscaler,
# Karpenter) emit no Kubernetes event, so this is the authoritative record.
# Metadata level: user, pod, response code (429 = blocked by a PodDisruptionBudget).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods/eviction"]
    verbs: [create]
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods"]
    verbs: [delete, deletecollection]
  - level: None
